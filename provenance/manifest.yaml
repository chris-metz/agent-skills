# Provenance manifest for the skills in this repo.
#
# Maintained through the /skill-sync skill (skills/skill-sync/SKILL.md).
#
# origin: own   — home-grown. No upstream; skipped on sync runs.
# origin: fork  — derived from someone else's work and modified locally.
#
# Every fork has a verbatim copy of its upstream files under
# provenance/upstream/<name>/, frozen at fork.commit. Those snapshots are the
# pivot of every comparison:
#
#   diff(snapshot, local)          = our delta   — recomputed on every run
#   diff(snapshot, upstream@HEAD)  = their delta — what's on offer
#
# So local_changes below is only a prose summary for humans. The diff against
# the snapshot is the truth; prose can go stale, the snapshot cannot.

sources:
  mattpocock:
    repo: https://github.com/mattpocock/skills
    clone: https://github.com/mattpocock/skills.git
    license: MIT
    copyright: Copyright (c) 2026 Matt Pocock
    layout_note: >
      Actively developed and restructured more than once. It is now a Claude
      Code plugin, with skills sorted into buckets (skills/engineering/,
      skills/productivity/, skills/misc/, skills/in-progress/). Skills move
      between buckets and get renamed — always compare with `git log --follow`,
      never trust a fixed path.

skills:
  # -------------------------------------------------------------- home-grown -
  - name: abstraction-police
    origin: own

  - name: dead-code
    origin: own

  - name: uncommit
    origin: own

  - name: skill-sync
    origin: own
    note: The maintenance skill that keeps this manifest current.

  - name: mc-commit
    origin: own
    derived_from: >
      Started as a fork of the git-commit-helper skill in
      davila7/claude-code-templates (MIT), at
      cli-tool/components/skills/development/git-commit-helper/SKILL.md,
      commit db3670b6 (2026-01-08). Retired from sync tracking on 2026-08-06:
      upstream had not touched that file in seven months while our copy had
      moved on, so there was nothing left to sync. Ours now — changes here are
      not divergence from anything. The origin is kept for attribution, and
      restated as a `# source:` comment in the skill's own frontmatter.

  # ------------------------------------------- mattpocock/skills (MIT) -------
  - name: grill-me
    origin: fork
    source: mattpocock
    fork:
      commit: bb8fdc3fd12ce9729bb61f0885f51a420c3275ac
      date: "2026-08-06"
    files:
      - local: skills/grill-me/SKILL.md
        upstream: skills/productivity/grill-me/SKILL.md
        snapshot: provenance/upstream/grill-me/SKILL.md
      - local: skills/grill-me/agents/openai.yaml
        upstream: skills/productivity/grill-me/agents/openai.yaml
        snapshot: provenance/upstream/grill-me/agents/openai.yaml
    local_changes: >
      None — verbatim copy of upstream. grill-me is now just the user-facing
      trigger that runs a /grilling session; the substance lives in the
      grilling skill.
    history: >
      Was forked at 62f43a18 (2026-04-28) and locally expanded. On 2026-06-12
      upstream split the skill: the body moved to a new /grilling skill and
      grill-me was hollowed out into a wrapper. We followed that split on
      2026-08-06 and dropped our local expansion — see the grilling entry.

  - name: grilling
    origin: fork
    source: mattpocock
    fork:
      commit: bb8fdc3fd12ce9729bb61f0885f51a420c3275ac
      date: "2026-08-06"
    files:
      - local: skills/grilling/SKILL.md
        upstream: skills/productivity/grilling/SKILL.md
        snapshot: provenance/upstream/grilling/SKILL.md
      - local: skills/grilling/agents/openai.yaml
        upstream: skills/productivity/grilling/agents/openai.yaml
        snapshot: provenance/upstream/grilling/agents/openai.yaml
    local_changes: >
      None — verbatim copy of upstream.
    history: >
      Adopted 2026-08-06 when we followed upstream's grill-me/grilling split.
      Note that `git log --follow` traces this file back through grill-me:
      grilling is the continuation of the original grill-me, so our old local
      grill-me and this file are siblings from a common ancestor. Our previous
      local version asked one question per turn; this one asks a whole frontier
      per round. That behaviour change was accepted deliberately.

  - name: research
    origin: fork
    source: mattpocock
    fork:
      commit: 0d74d01cbc64ca27778a49b38599f70c534e76a0
      date: "2026-07-01"
    files:
      - local: skills/research/SKILL.md
        upstream: skills/engineering/research/SKILL.md
        snapshot: provenance/upstream/research/SKILL.md
      - local: skills/research/agents/openai.yaml
        upstream: skills/engineering/research/agents/openai.yaml
        snapshot: provenance/upstream/research/agents/openai.yaml
        fork_commit: 697d4ce9742da558fd1ba6697c8e9775e2e302dd
    local_changes: >
      Body unchanged; only an attribution comment at the end of the file.
      openai.yaml: implicit invocation enabled, different short_description.

  - name: wayfinder
    origin: fork
    source: mattpocock
    fork:
      commit: 260225724133c4a204489599f04642aa089259a0
      date: "2026-07-13"
    files:
      - local: skills/wayfinder/SKILL.md
        upstream: skills/engineering/wayfinder/SKILL.md
        snapshot: provenance/upstream/wayfinder/SKILL.md
      - local: skills/wayfinder/agents/openai.yaml
        upstream: skills/engineering/wayfinder/agents/openai.yaml
        snapshot: provenance/upstream/wayfinder/agents/openai.yaml
        fork_commit: 697d4ce9742da558fd1ba6697c8e9775e2e302dd
    local_changes: >
      Pinned to GitHub instead of tracker-agnostic: a dedicated "GitHub
      operations" section with concrete gh CLI commands, GitHub issue numbers
      as ticket identity, native GitHub dependencies for blocking. The pointer
      to /setup-matt-pocock-skills and the tracker doc is gone. Ticket type
      "prototype" removed. Every "/grilling and /domain-modeling" reference is
      reduced to /grilling alone, because we have grilling but not
      domain-modeling — so those three lines stay divergent even though the
      grilling half now matches. Research findings land as a resolution comment
      on the ticket rather than on a research/<name> branch.
      openai.yaml: different short_description.
    upstream_status: >
      Only 4 changed lines since the fork: three emphasis reformats
      (*like this* → _like this_, pure noise) and one rewording of the
      "Grilling" ticket type. That one lands on the very line we rewrote to
      /grill-me — technically a conflict, substantively irrelevant.
      Note: the tracker abstraction was already upstream BEFORE our fork. Our
      GitHub pinning is a deliberate rollback, not divergence caused by an
      upstream change — do not confuse the two on future merges.

  - name: wait-what
    origin: fork
    source: mattpocock
    fork:
      commit: 50777fcc0982d5867997a75a1e0731b9daac94eb
      date: "2026-08-05"
    files:
      - local: skills/wait-what/SKILL.md
        upstream: skills/productivity/wait-what/SKILL.md
        snapshot: provenance/upstream/wait-what/SKILL.md
      - local: skills/wait-what/agents/openai.yaml
        upstream: skills/productivity/wait-what/agents/openai.yaml
        snapshot: provenance/upstream/wait-what/agents/openai.yaml
    local_changes: >
      One line: "the ubiquitous language from `CONTEXT.md`" →
      "the ubiquitous language of this codebase", because we never adopted
      Matt's CONTEXT.md convention. openai.yaml unchanged.
    keep_diverged: >
      Deliberate and reaffirmed 2026-08-06. Upstream's wording points at a file
      most of our repos do not have, so the instruction would go nowhere; ours
      works everywhere. Do not "fix" this delta to match upstream.

# Standalone note: the agents/openai.yaml files of every home-grown skill are
# ours. The format and convention, however, come from mattpocock (upstream
# commit 697d4ce9, "add Codex agents/openai.yaml metadata to every skill") — so
# follow along if the format changes there.

reviews:
  - date: "2026-08-06"
    scope: Initial inventory — provenance established for all skills, snapshots created.
    upstream_heads:
      mattpocock: bb8fdc3f
      davila7: db3670b6
    outcome: >
      Nothing taken. Two skills had moved on upstream and were left open on the
      day: grill-me (dissolved upstream into a /grilling skill plus a wrapper)
      and wayfinder (4 changed lines, mostly reformatting). Both were settled
      later the same day — see the next entry.

  - date: "2026-08-06"
    scope: Resolved the grill-me question left open by the initial inventory.
    upstream_heads:
      mattpocock: bb8fdc3f
    outcome: >
      Followed upstream's split. Took /grilling verbatim as a new skill and
      reduced grill-me to upstream's wrapper, dropping our local expansion.
      Both are now identical to upstream, so future syncs on them are
      fast-forwards. Accepted in the process: a whole frontier of questions per
      round instead of one question at a time, and third-person phrasing.
      Gained: non-blocking sub-agent fact-finding, an explicit termination
      condition, and the ❓/➡️ question format.
      Also repointed wayfinder's three /grill-me references at /grilling, and
      dropped "one question at a time" from its Grilling ticket type — that
      claim went stale the moment grilling started asking a frontier per round.
      This does not shrink wayfinder's delta (still 24 lines): upstream names
      /grilling AND /domain-modeling on those lines, and we have no
      domain-modeling skill.
    domain_modeling: >
      DECLINED, do not re-raise. /domain-modeling maintains a CONTEXT.md
      glossary (ubiquitous language, with an _Avoid_ list per term) plus ADRs.
      It is the reason wait-what and three wayfinder lines diverge. Reviewed on
      2026-08-06 and turned down: this repo has roughly six domain terms, one
      maintainer, and no naming disputes, and skill-sync's own table already
      defines the provenance vocabulary a CONTEXT.md would restate.
      Reconsider only if a repo here grows real domain depth or more than one
      maintainer.

  - date: "2026-08-06"
    scope: Retired mc-commit from sync tracking.
    outcome: >
      mc-commit is now origin: own. Upstream had not touched the file since
      2026-01-08 while our copy had moved on by 16 lines, so tracking it cost
      attention and returned nothing. Its snapshot is deleted and davila7 is no
      longer listed as a source; the attribution survives in the skill's
      derived_from field here and in its own frontmatter. Five forks remain,
      all from mattpocock.
